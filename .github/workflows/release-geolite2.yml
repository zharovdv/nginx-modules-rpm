name: Build, sign and release GeoLite2 databases

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild packaging for the current database bundle
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

concurrency:
  group: release-maxmind-geolite2
  cancel-in-progress: false

jobs:
  discover-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: geolite2-discovery
    outputs:
      publish: "${{ steps.prepare.outputs.publish }}"
      artifact_dir: "${{ steps.prepare.outputs.artifact_dir }}"
      bundle_id: "${{ steps.prepare.outputs.bundle_id }}"
      package_version: "${{ steps.prepare.outputs.package_version }}"
      release_tag: "${{ steps.prepare.outputs.release_tag }}"
    env:
      BUILDER_IMAGE: nginx-modules-rpm-builder:rl9
      DOCKER_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check official GeoLite2 release dates
        id: databases
        env:
          MAXMIND_ACCOUNT_ID: "${{ secrets.MAXMIND_ACCOUNT_ID }}"
          MAXMIND_LICENSE_KEY: "${{ secrets.MAXMIND_LICENSE_KEY }}"
        run: |
          set -Eeuo pipefail
          chmod 0755 check-geolite2-updates
          ./check-geolite2-updates

      - name: Check whether the bundle is already published
        id: release
        env:
          GH_TOKEN: "${{ github.token }}"
          EXPECTED_BUNDLE_ID: "${{ steps.databases.outputs.bundle_id }}"
          FORCE_REBUILD: "${{ inputs.force_rebuild || false }}"
        run: |
          set -Eeuo pipefail

          mapfile -t previous_tags < <(
              gh release list --limit 1000 --json tagName \
                  --jq '.[] | select(.tagName | startswith("maxmind-geolite2-")) | .tagName'
          )

          published_bundle_id=""
          published_metapackage_version=""
          published_data_releases_are_numeric=true
          : >previous-build-info.txt
          if [[ "${#previous_tags[@]}" -gt 0 ]]; then
              gh release download "${previous_tags[0]}" \
                  --pattern build-info.txt \
                  --clobber \
                  --output previous-build-info.txt
              published_bundle_id="$(sed -n 's/^Bundle ID: //p' previous-build-info.txt)"
              published_metapackage_version="$(
                  sed -n 's/^Metapackage version: //p' previous-build-info.txt
              )"
              for database in Country City ASN; do
                  data_evr="$(sed -n "s/^${database} RPM: //p" previous-build-info.txt)"
                  if [[ ! "$data_evr" =~ ^[0-9]+([.][0-9]+){2}-[0-9]+$ ]]; then
                      published_data_releases_are_numeric=false
                  fi
              done
          fi

          if
              [[ "$FORCE_REBUILD" != true ]] &&
                  [[ "$published_bundle_id" == "$EXPECTED_BUNDLE_ID" ]] &&
                  [[ "$published_metapackage_version" =~ ^[0-9]+([.][0-9]+){3}$ ]] &&
                  [[ "$published_data_releases_are_numeric" == true ]]
          then
              echo "update_available=false" >>"$GITHUB_OUTPUT"
              echo "GeoLite2 bundle ${EXPECTED_BUNDLE_ID} is already published" >>"$GITHUB_STEP_SUMMARY"
          else
              echo "update_available=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.update_available == 'true'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.release.outputs.update_available == 'true'
        with:
          context: .
          load: true
          pull: true
          platforms: "${{ env.DOCKER_PLATFORM }}"
          tags: "${{ env.BUILDER_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download previously published database RPMs
        if: steps.release.outputs.update_available == 'true'
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -Eeuo pipefail

          mkdir -p previous-geolite2-rpms
          mapfile -t previous_tags < <(
              gh release list --limit 1000 --json tagName \
                  --jq '.[] | select(.tagName | startswith("maxmind-geolite2-")) | .tagName'
          )

          if [[ "${#previous_tags[@]}" -gt 0 ]]; then
              gh release download "${previous_tags[0]}" \
                  --pattern 'maxmind-geolite2-*.rpm' \
                  --dir previous-geolite2-rpms
          fi

      - name: Download, verify and build unsigned database RPMs
        if: steps.release.outputs.update_available == 'true'
        env:
          MAXMIND_ACCOUNT_ID: "${{ secrets.MAXMIND_ACCOUNT_ID }}"
          MAXMIND_LICENSE_KEY: "${{ secrets.MAXMIND_LICENSE_KEY }}"
        run: |
          set -Eeuo pipefail

          mkdir -p dist
          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            --volume "${PWD}/dist:/dist" \
            --volume "${PWD}/previous-geolite2-rpms:/previous-geolite2-rpms:ro" \
            --volume "${PWD}/previous-build-info.txt:/previous-build-info.txt:ro" \
            --env MAXMIND_ACCOUNT_ID \
            --env MAXMIND_LICENSE_KEY \
            --env "HOST_UID=$(id -u)" \
            --env "HOST_GID=$(id -g)" \
            --env PREVIOUS_BUILD_INFO_PATH=/previous-build-info.txt \
            --env PREVIOUS_RPM_DIRECTORY=/previous-geolite2-rpms \
            --entrypoint /usr/local/bin/build-maxmind-geolite2-rpms \
            "$BUILDER_IMAGE"

      - name: Reuse unchanged signed database RPMs
        if: steps.release.outputs.update_available == 'true'
        run: |
          set -Eeuo pipefail

          artifact_dir="$(find dist/maxmind-geolite2 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          [[ -n "$artifact_dir" ]]

          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            --volume "${PWD}/dist:/dist" \
            --volume "${PWD}/previous-geolite2-rpms:/previous-geolite2-rpms:ro" \
            --env "RPM_DIRECTORY=/${artifact_dir}" \
            --env "PREVIOUS_RPM_DIRECTORY=/previous-geolite2-rpms" \
            --entrypoint /usr/local/bin/reuse-maxmind-geolite2-rpms \
            "$BUILDER_IMAGE"

          (
              cd "$artifact_dir"
              sha256sum ./*.rpm build-info.txt >SHA256SUMS
          )

      - name: Prepare unsigned bundle
        id: prepare
        if: steps.release.outputs.update_available == 'true'
        env:
          EXPECTED_BUNDLE_ID: "${{ steps.databases.outputs.bundle_id }}"
        run: |
          set -Eeuo pipefail

          artifact_dir="$(find dist/maxmind-geolite2 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          [[ -n "$artifact_dir" ]]
          bundle_id="$(basename "$artifact_dir")"
          [[ "$bundle_id" == "$EXPECTED_BUNDLE_ID" ]]
          metapackage_version="$(sed -n 's/^Metapackage version: //p' "${artifact_dir}/build-info.txt")"
          rpm_release="$(sed -n 's/^RPM release: //p' "${artifact_dir}/build-info.txt")"
          [[ "$metapackage_version" =~ ^[0-9]+([.][0-9]+){3}$ ]]
          [[ "$rpm_release" =~ ^[0-9]+$ ]]

          {
              echo "publish=true"
              echo "artifact_dir=$artifact_dir"
              echo "bundle_id=$bundle_id"
              echo "package_version=$metapackage_version"
              echo "release_tag=maxmind-geolite2-${metapackage_version}-${rpm_release}"
          } >>"$GITHUB_OUTPUT"

      - name: Upload unsigned bundle for protected release
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "unsigned-geolite2-${{ steps.prepare.outputs.bundle_id }}"
          path: "${{ steps.prepare.outputs.artifact_dir }}"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: discover-and-build
    if: needs.discover-and-build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      ARTIFACT_DIR: "dist/maxmind-geolite2/${{ needs.discover-and-build.outputs.bundle_id }}"
      BUILDER_IMAGE: nginx-modules-rpm-builder:rl9
      DOCKER_PLATFORM: linux/amd64
      PACKAGE_VERSION: "${{ needs.discover-and-build.outputs.package_version }}"
      PUBLIC_KEY_PATH: keys/RPM-GPG-KEY-nginx-modules-rpm
      RELEASE_TAG: "${{ needs.discover-and-build.outputs.release_tag }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download unsigned bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "unsigned-geolite2-${{ needs.discover-and-build.outputs.bundle_id }}"
          path: "${{ env.ARTIFACT_DIR }}"

      - name: Load reviewed signing-key fingerprint
        run: |
          set -Eeuo pipefail

          fingerprint="$(sed -n 's/^RPM_GPG_FINGERPRINT=//p' pins.env)"
          fingerprint="${fingerprint^^}"

          if [[ ! "$fingerprint" =~ ^[0-9A-F]{40}$ ]]; then
              printf "Invalid RPM_GPG_FINGERPRINT in pins.env; expected the full 40-character fingerprint\n" >&2
              exit 1
          fi

          echo "RPM_GPG_FINGERPRINT=$fingerprint" >>"$GITHUB_ENV"

      - name: Validate public signing key
        run: |
          set -Eeuo pipefail

          [[ -s "$PUBLIC_KEY_PATH" ]]
          mapfile -t public_key_fingerprints < <(
              gpg --batch --with-colons --show-keys --fingerprint "$PUBLIC_KEY_PATH" |
                  awk -F: '$1 == "fpr" { print toupper($10) }'
          )
          printf "%s\n" "${public_key_fingerprints[@]}" | grep -Fxq "$RPM_GPG_FINGERPRINT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          platforms: "${{ env.DOCKER_PLATFORM }}"
          tags: "${{ env.BUILDER_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Refuse overwrite
        env:
          GH_TOKEN: "${{ github.token }}"
        run: '! gh release view "$RELEASE_TAG" >/dev/null 2>&1'

      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: "${{ secrets.RPM_GPG_PRIVATE_KEY }}"
          RPM_GPG_KEY_ID: "${{ vars.RPM_GPG_KEY_ID }}"
        run: |
          set -Eeuo pipefail

          (
              cd "$ARTIFACT_DIR"
              sha256sum --check SHA256SUMS
          )

          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            --volume "${PWD}/dist:/dist" \
            --env RPM_GPG_PRIVATE_KEY \
            --env RPM_GPG_KEY_ID \
            --env RPM_GPG_FINGERPRINT \
            --env "RPM_DIRECTORY=/${ARTIFACT_DIR}" \
            --entrypoint /usr/local/bin/sign-nginx-module-rpms \
            "$BUILDER_IMAGE"

      - name: Verify signed artifacts and prepare release notes
        run: |
          set -Eeuo pipefail

          (
              cd "$ARTIFACT_DIR"
              sha256sum --check SHA256SUMS
          )

          cat >"${ARTIFACT_DIR}/RELEASE_NOTES.md" <<EOF
          Signed community RPM packages for the MaxMind GeoLite2 Country, City and ASN databases.

          GeoLite2 bundle: ${{ needs.discover-and-build.outputs.bundle_id }}
          RPM version: ${PACKAGE_VERSION}
          Signing key fingerprint: ${RPM_GPG_FINGERPRINT}

          This product includes GeoLite2 Data created by MaxMind, available from https://www.maxmind.com.
          Use and redistribution are subject to CC BY-SA 4.0 and the MaxMind GeoLite2 EULA.
          See build-info.txt, GEOLITE2-LICENSE.txt and SHA256SUMS for details.
          EOF

      - name: Attest signed RPM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/maxmind-geolite2/**/*.rpm"

      - name: Publish immutable release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -Eeuo pipefail

          gh release create "$RELEASE_TAG" \
            "$ARTIFACT_DIR"/*.rpm \
            "$ARTIFACT_DIR/build-info.txt" \
            "$ARTIFACT_DIR/SHA256SUMS" \
            packaging/maxmind-geolite2/GEOLITE2-LICENSE.txt \
            "$PUBLIC_KEY_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$ARTIFACT_DIR/RELEASE_NOTES.md"

      - name: Remove superseded GeoLite2 releases
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -Eeuo pipefail

          mapfile -t superseded_tags < <(
              gh release list --limit 1000 --json tagName \
                  --jq '.[] | select(.tagName | startswith("maxmind-geolite2-")) | .tagName' |
                  grep -Fxv "$RELEASE_TAG" || true
          )

          for tag in "${superseded_tags[@]}"; do
              gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Build and sign DNF repository
        env:
          GH_TOKEN: "${{ github.token }}"
          RPM_GPG_PRIVATE_KEY: "${{ secrets.RPM_GPG_PRIVATE_KEY }}"
          RPM_GPG_KEY_ID: "${{ vars.RPM_GPG_KEY_ID }}"
        run: |
          set -Eeuo pipefail
          ./prepare-repository

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload DNF repository for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: repository-site

  deploy-repository:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Publish DNF repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
