name: Build, sign and release RPM

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to release from reviewed pins
        type: choice
        required: true
        options: [nchan, geoip2]

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

concurrency:
  group: release-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    env:
      BUILDER_IMAGE: nginx-modules-rpm-builder:rl9
      DOCKER_PLATFORM: linux/amd64
      PUBLIC_KEY_PATH: keys/RPM-GPG-KEY-nginx-modules-rpm
      MODULE: "${{ inputs.module }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load reviewed release inputs
        run: |
          set -Eeuo pipefail

          load_pin() {
              local name="$1"
              local pattern="$2"
              local value

              value="$(sed -n "s/^${name}=//p" pins.env)"

              if [[ ! "$value" =~ $pattern ]]; then
                  printf "Invalid or missing %s in pins.env\n" "$name" >&2
                  exit 1
              fi

              echo "${name}=${value}" >>"$GITHUB_ENV"
          }

          load_pin NGINX_STABLE_CI_VERSION '^[0-9]+([.][0-9]+){2}$'
          load_pin PKG_OSS_CI_COMMIT '^[0-9a-f]{40}$'
          load_pin NCHAN_CI_COMMIT '^[0-9a-f]{40}$'
          load_pin GEOIP2_CI_COMMIT '^[0-9a-f]{40}$'

          fingerprint="$(sed -n 's/^RPM_GPG_FINGERPRINT=//p' pins.env)"
          fingerprint="${fingerprint^^}"

          if [[ ! "$fingerprint" =~ ^[0-9A-F]{40}$ ]]; then
              printf "Invalid RPM_GPG_FINGERPRINT in pins.env; expected the full 40-character fingerprint\n" >&2
              exit 1
          fi

          echo "RPM_GPG_FINGERPRINT=$fingerprint" >>"$GITHUB_ENV"

      - name: Select reviewed module inputs
        run: |
          set -Eeuo pipefail

          if [[ "$MODULE" == nchan ]]; then
              module_ref="$NCHAN_CI_COMMIT"
          else
              module_ref="$GEOIP2_CI_COMMIT"
          fi

          {
              echo "MODULE_REF=$module_ref"
              echo "NGINX_REPO=stable"
              echo "NGINX_VERSION=$NGINX_STABLE_CI_VERSION"
              echo "PKG_OSS_REF=$PKG_OSS_CI_COMMIT"
          } >>"$GITHUB_ENV"

      - name: Validate public signing key
        run: |
          set -Eeuo pipefail

          [[ -s "$PUBLIC_KEY_PATH" ]]
          mapfile -t public_key_fingerprints < <(
              gpg --batch --with-colons --show-keys --fingerprint "$PUBLIC_KEY_PATH" |
                  awk -F: '$1 == "fpr" { print toupper($10) }'
          )
          printf "%s\n" "${public_key_fingerprints[@]}" | grep -Fxq "$RPM_GPG_FINGERPRINT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          platforms: "${{ env.DOCKER_PLATFORM }}"
          tags: "${{ env.BUILDER_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and validate
        run: |
          set -Eeuo pipefail

          mkdir -p dist
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm builder

      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: "${{ secrets.RPM_GPG_PRIVATE_KEY }}"
          RPM_GPG_KEY_ID: "${{ vars.RPM_GPG_KEY_ID }}"
        run: |
          set -Eeuo pipefail

          artifact_dir="$(
              find "dist/nginx-module-${MODULE}" -mindepth 2 -maxdepth 2 -type d |
                  head -n 1
          )"
          [[ -n "$artifact_dir" ]]

          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            --volume "${PWD}/dist:/dist" \
            --env RPM_GPG_PRIVATE_KEY \
            --env RPM_GPG_KEY_ID \
            --env RPM_GPG_FINGERPRINT \
            --env "RPM_DIRECTORY=/dist/${artifact_dir#dist/}" \
            --entrypoint /usr/local/bin/sign-nginx-module-rpms \
            "$BUILDER_IMAGE"

          echo "artifact_dir=$artifact_dir" >>"$GITHUB_ENV"

      - name: Prepare release metadata
        run: |
          set -Eeuo pipefail

          (
              cd "$artifact_dir"
              sha256sum --check SHA256SUMS
          )

          binary_rpm="$(
              find "$artifact_dir" -maxdepth 1 -type f -name "nginx-module-${MODULE}-*.rpm" |
                  sort |
                  head -n 1
          )"
          [[ -n "$binary_rpm" ]]

          package_nevra="$(
              docker run --rm \
                --volume "${PWD}/${artifact_dir}:/rpm:ro" \
                --entrypoint rpm \
                "$BUILDER_IMAGE" \
                -qp \
                --queryformat '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' \
                "/rpm/$(basename "$binary_rpm")"
          )"

          echo "release_tag=$package_nevra" >>"$GITHUB_ENV"

          cat >"${artifact_dir}/RELEASE_NOTES.md" <<EOF
          Signed community RPM for ${MODULE}, built from reviewed immutable commits
          against the official nginx.org EL9 package.

          Signing key fingerprint: ${RPM_GPG_FINGERPRINT}

          See build-info.txt and SHA256SUMS for build information and checksums.
          EOF

      - name: Refuse overwrite
        env:
          GH_TOKEN: "${{ github.token }}"
        run: '! gh release view "$release_tag" >/dev/null 2>&1'

      - name: Attest signed RPM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/**/*.rpm"

      - name: Publish immutable release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -Eeuo pipefail

          gh release create "$release_tag" \
            "$artifact_dir"/*.rpm \
            "$artifact_dir/build-info.txt" \
            "$artifact_dir/SHA256SUMS" \
            "$PUBLIC_KEY_PATH" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --notes-file "$artifact_dir/RELEASE_NOTES.md"

      - name: Build and sign DNF repository
        env:
          GH_TOKEN: "${{ github.token }}"
          RPM_GPG_PRIVATE_KEY: "${{ secrets.RPM_GPG_PRIVATE_KEY }}"
          RPM_GPG_KEY_ID: "${{ vars.RPM_GPG_KEY_ID }}"
        run: |
          set -Eeuo pipefail
          chmod 0755 prepare-repository
          ./prepare-repository

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload DNF repository for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: repository-site

  deploy-repository:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Publish DNF repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
