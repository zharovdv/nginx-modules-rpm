name: Build, sign and release RPM

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        required: true
        options: [nchan, geoip2]
      nginx_repo:
        type: choice
        required: true
        default: stable
        options: [stable, mainline]
      nginx_version:
        description: Exact nginx.org NGINX version; latest is rejected
        type: string
        required: true
      module_commit:
        description: Reviewed full 40-character upstream commit SHA
        type: string
        required: true
      module_version:
        description: Upstream release version, for example 1.3.8
        type: string
        required: true
      pkg_oss_commit:
        description: Reviewed full 40-character nginx/pkg-oss commit SHA
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.module }}-${{ inputs.module_version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    env:
      BUILDER_IMAGE: nginx-modules-rpm-builder:rl9
      DOCKER_PLATFORM: linux/amd64
      MODULE: "${{ inputs.module }}"
      MODULE_REF: "${{ inputs.module_commit }}"
      MODULE_VERSION: "${{ inputs.module_version }}"
      NGINX_REPO: "${{ inputs.nginx_repo }}"
      NGINX_VERSION: "${{ inputs.nginx_version }}"
      PKG_OSS_REF: "${{ inputs.pkg_oss_commit }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load reviewed signing identity
        run: |
          set -Eeuo pipefail
          fingerprint="$(sed -n 's/^RPM_GPG_FINGERPRINT=//p' pins.env)"
          [[ "$fingerprint" =~ ^[0-9A-Fa-f]{40}$ ]]
          echo "RPM_GPG_FINGERPRINT=${fingerprint^^}" >>"$GITHUB_ENV"
      - name: Validate immutable inputs
        run: |
          set -Eeuo pipefail
          [[ "$NGINX_VERSION" =~ ^[0-9]+([.][0-9]+){2}$ ]]
          [[ "$MODULE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PKG_OSS_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODULE_VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          platforms: "${{ env.DOCKER_PLATFORM }}"
          tags: "${{ env.BUILDER_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and validate
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm builder
      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: "${{ secrets.RPM_GPG_PRIVATE_KEY }}"
          RPM_GPG_KEY_ID: "${{ vars.RPM_GPG_KEY_ID }}"
        run: |
          set -Eeuo pipefail
          artifact_dir="$(find "dist/nginx-module-${MODULE}" -mindepth 2 -maxdepth 2 -type d | head -n 1)"
          [[ -n "$artifact_dir" ]]
          docker run --rm --platform "$DOCKER_PLATFORM" \
            --volume "${PWD}/dist:/dist" \
            --env RPM_GPG_PRIVATE_KEY --env RPM_GPG_KEY_ID --env RPM_GPG_FINGERPRINT \
            --env "RPM_DIRECTORY=/dist/${artifact_dir#dist/}" \
            --entrypoint /usr/local/bin/sign-nginx-module-rpms "$BUILDER_IMAGE"
          echo "artifact_dir=$artifact_dir" >>"$GITHUB_ENV"
      - name: Prepare release metadata
        run: |
          set -Eeuo pipefail
          (cd "$artifact_dir" && sha256sum -c SHA256SUMS)
          binary_rpm="$(
            find "$artifact_dir" -maxdepth 1 -type f -name "nginx-module-${MODULE}-*.rpm" |
              sort |
              head -n 1
          )"
          package_nevra="$(
            docker run --rm \
              -v "${PWD}/${artifact_dir}:/rpm:ro" \
              --entrypoint rpm \
              "$BUILDER_IMAGE" \
              -qp \
              --queryformat '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' \
              "/rpm/$(basename "$binary_rpm")"
          )"
          echo "release_tag=$package_nevra" >>"$GITHUB_ENV"
          cat >"${artifact_dir}/RELEASE_NOTES.md" <<EOF
          Signed community RPM for ${MODULE}, built from reviewed immutable commits
          against the official nginx.org EL9 package. See build-info.txt and
          SHA256SUMS for provenance.
          EOF
      - name: Refuse overwrite
        env:
          GH_TOKEN: "${{ github.token }}"
        run: '! gh release view "$release_tag" >/dev/null 2>&1'
      - name: Attest signed RPM provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/**/*.rpm"
      - name: Publish immutable release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "$release_tag" \
            "$artifact_dir"/*.rpm "$artifact_dir/build-info.txt" "$artifact_dir/SHA256SUMS" \
            --target "$GITHUB_SHA" --title "$release_tag" --notes-file "$artifact_dir/RELEASE_NOTES.md"
