name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Shell and GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare lint scripts
        run: chmod 0755 install-lint-tools lint

      - name: Install pinned lint tools
        run: |
          set -Eeuo pipefail
          ./install-lint-tools "$RUNNER_TEMP/lint-tools"
          echo "$RUNNER_TEMP/lint-tools" >>"$GITHUB_PATH"

      - name: Run lint
        run: ./lint
