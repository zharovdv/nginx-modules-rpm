name: Publish DNF repository

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: publish-dnf-repository
  cancel-in-progress: false

jobs:
  build-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      BUILDER_IMAGE: nginx-modules-rpm-builder:rl9
      DOCKER_PLATFORM: linux/amd64
      PUBLIC_KEY_PATH: keys/RPM-GPG-KEY-nginx-modules-rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load reviewed signing-key fingerprint
        run: |
          set -Eeuo pipefail

          fingerprint="$(sed -n 's/^RPM_GPG_FINGERPRINT=//p' pins.env)"
          fingerprint="${fingerprint^^}"

          if [[ ! "$fingerprint" =~ ^[0-9A-F]{40}$ ]]; then
              printf "Invalid RPM_GPG_FINGERPRINT in pins.env; expected the full 40-character fingerprint\n" >&2
              exit 1
          fi

          echo "RPM_GPG_FINGERPRINT=$fingerprint" >>"$GITHUB_ENV"

      - name: Validate public signing key
        run: |
          set -Eeuo pipefail

          [[ -s "$PUBLIC_KEY_PATH" ]]
          mapfile -t public_key_fingerprints < <(
              gpg --batch --with-colons --show-keys --fingerprint "$PUBLIC_KEY_PATH" |
                  awk -F: '$1 == "fpr" { print toupper($10) }'
          )
          printf "%s\n" "${public_key_fingerprints[@]}" | grep -Fxq "$RPM_GPG_FINGERPRINT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          platforms: "${{ env.DOCKER_PLATFORM }}"
          tags: "${{ env.BUILDER_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and sign DNF repository
        env:
          GH_TOKEN: "${{ github.token }}"
          RPM_GPG_PRIVATE_KEY: "${{ secrets.RPM_GPG_PRIVATE_KEY }}"
          RPM_GPG_KEY_ID: "${{ vars.RPM_GPG_KEY_ID }}"
        run: |
          set -Eeuo pipefail
          chmod 0755 prepare-repository
          ./prepare-repository

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload DNF repository for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository-site

  deploy-repository:
    needs: build-repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Publish DNF repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
