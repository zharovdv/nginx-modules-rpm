- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution_major_version == '9'
      - ansible_facts.architecture == 'x86_64'
    fail_msg: nginx_modules supports Enterprise Linux 9 x86_64 only

- name: Import NGINX modules RPM signing key
  ansible.builtin.rpm_key:
    key: "{{ nginx_modules_repository_gpgkey }}"
    fingerprint: "{{ nginx_modules_gpg_fingerprint }}"
    state: present

- name: Configure NGINX modules repository
  ansible.builtin.yum_repository:
    name: nginx-modules-rpm
    description: NGINX dynamic modules for Enterprise Linux 9
    baseurl: "{{ nginx_modules_repository_baseurl }}"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "{{ nginx_modules_repository_gpgkey }}"
    metadata_expire: 1h

- name: Install NGINX modules
  ansible.builtin.dnf:
    name: "nginx-module-{{ item }}"
    state: present
    update_cache: true
  loop: "{{ nginx_modules }}"
  notify: Validate and reload NGINX

- name: Check requested GeoLite2 databases
  ansible.builtin.assert:
    that:
      - nginx_geoip2_databases | difference(['country', 'city', 'asn']) | length == 0
    fail_msg: nginx_geoip2_databases accepts country, city and asn only

- name: Install GeoLite2 databases
  ansible.builtin.dnf:
    name: "maxmind-geolite2-{{ item }}"
    state: latest
    update_cache: true
  loop: "{{ nginx_geoip2_databases }}"
  notify: Validate and reload NGINX

- name: Remove obsolete module include files
  ansible.builtin.file:
    path: "/usr/share/nginx/modules/50-{{ item }}.conf"
    state: absent
  loop: "{{ nginx_modules }}"
  notify: Validate and reload NGINX

- name: Enable NGINX modules
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    line: "load_module modules/{{ nginx_modules_shared_objects[item] }};"
    insertbefore: BOF
    state: present
  loop: "{{ nginx_modules }}"
  notify: Validate and reload NGINX

- name: Validate NGINX configuration
  ansible.builtin.command: nginx -t
  changed_when: false
